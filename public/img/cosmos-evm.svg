<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="#0a0a0a"/>
  
  <!-- Cosmos-like atom symbol -->
  <g filter="url(#glow)">
    <!-- Orbits -->
    <ellipse cx="50" cy="50" rx="40" ry="20" fill="none" stroke="url(#logoGradient)" stroke-width="1.5" transform="rotate(0 50 50)"/>
    <ellipse cx="50" cy="50" rx="40" ry="20" fill="none" stroke="url(#logoGradient)" stroke-width="1.5" transform="rotate(60 50 50)"/>
    <ellipse cx="50" cy="50" rx="40" ry="20" fill="none" stroke="url(#logoGradient)" stroke-width="1.5" transform="rotate(120 50 50)"/>
    
    <!-- EVM lightning bolt -->
    <path d="M50 25 L40 50 L55 50 L45 75 L60 55 L48 55 L58 25 Z" fill="url(#logoGradient)"/>
    
    <!-- Core circles -->
    <circle cx="50" cy="50" r="12" fill="url(#logoGradient)" opacity="0.8"/>
  </g>
</svg>