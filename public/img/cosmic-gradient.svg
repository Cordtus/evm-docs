<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="grad1" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="grad2" cx="20%" cy="80%" r="50%" fx="20%" fy="80%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="grad3" cx="80%" cy="30%" r="40%" fx="80%" fy="30%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Particle effect -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background gradients -->
  <rect width="1200" height="800" fill="#0a0a0a"/>
  <rect width="1200" height="800" fill="url(#grad1)"/>
  <rect width="1200" height="800" fill="url(#grad2)"/>
  <rect width="1200" height="800" fill="url(#grad3)"/>
  
  <!-- Particles -->
  <g filter="url(#glow)">
    <!-- Orange particles -->
    <circle cx="400" cy="300" r="2" fill="#f97316" opacity="0.8"/>
    <circle cx="600" cy="200" r="1.5" fill="#f97316" opacity="0.7"/>
    <circle cx="800" cy="400" r="2.5" fill="#f97316" opacity="0.9"/>
    <circle cx="300" cy="500" r="1.8" fill="#f97316" opacity="0.6"/>
    <circle cx="700" cy="600" r="2.2" fill="#f97316" opacity="0.8"/>
    
    <!-- Amber particles -->
    <circle cx="500" cy="350" r="2" fill="#f59e0b" opacity="0.7"/>
    <circle cx="200" cy="250" r="1.5" fill="#f59e0b" opacity="0.6"/>
    <circle cx="900" cy="450" r="2.5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="350" cy="550" r="1.8" fill="#f59e0b" opacity="0.5"/>
    <circle cx="750" cy="650" r="2.2" fill="#f59e0b" opacity="0.7"/>
    
    <!-- Purple particles -->
    <circle cx="450" cy="400" r="2" fill="#8b5cf6" opacity="0.6"/>
    <circle cx="250" cy="300" r="1.5" fill="#8b5cf6" opacity="0.5"/>
    <circle cx="850" cy="500" r="2.5" fill="#8b5cf6" opacity="0.7"/>
    <circle cx="400" cy="600" r="1.8" fill="#8b5cf6" opacity="0.4"/>
    <circle cx="800" cy="700" r="2.2" fill="#8b5cf6" opacity="0.6"/>
  </g>
  
  <!-- Stars -->
  <g>
    <circle cx="100" cy="100" r="0.8" fill="white" opacity="0.5"/>
    <circle cx="150" cy="200" r="0.6" fill="white" opacity="0.4"/>
    <circle cx="250" cy="150" r="0.7" fill="white" opacity="0.6"/>
