    <circle cx="1125" cy="300" r="0.9" fill="white" opacity="0.7"/>
    
    <circle cx="150" cy="450" r="0.8" fill="white" opacity="0.5"/>
    <circle cx="250" cy="500" r="0.6" fill="white" opacity="0.4"/>
    <circle cx="350" cy="475" r="0.7" fill="white" opacity="0.6"/>
    <circle cx="450" cy="525" r="0.5" fill="white" opacity="0.3"/>
