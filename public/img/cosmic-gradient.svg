    <circle cx="950" cy="150" r="0.5" fill="white" opacity="0.3"/>
    <circle cx="1050" cy="100" r="0.9" fill="white" opacity="0.7"/>
    <circle cx="1150" cy="200" r="0.6" fill="white" opacity="0.4"/>
    
    <circle cx="125" cy="300" r="0.8" fill="white" opacity="0.5"/>
    <circle cx="225" cy="350" r="0.6" fill="white" opacity="0.4"/>
    <circle cx="325" cy="325" r="0.7" fill="white" opacity="0.6"/>
